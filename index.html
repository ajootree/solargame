<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>밤하늘 관찰 원정대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #0B1026;
    --ink-2: #141B3C;
    --ink-3: #1D2650;
    --star: #E9ECFF;
    --star-dim: #8B93C4;
    --paper: #F3ECDA;
    --paper-2: #EBE1C8;
    --paper-line: #D8C9A3;
    --amber: #E8A33D;
    --amber-deep: #C97F1E;
    --ok: #6FCF97;
    --bad: #E0637A;

    --c-mercury: #9C9691;
    --c-venus: #E4C15C;
    --c-earth: #4C8CE0;
    --c-mars: #C1502E;
    --c-jupiter: #C68B59;
    --c-saturn: #DCC08C;
    --c-uranus: #7FD8CE;
    --c-neptune: #3E63C9;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{ height:100%; }
  body{
    background: radial-gradient(ellipse at 20% -10%, #1a2456 0%, var(--ink) 55%, #060812 100%);
    color: var(--star);
    font-family: 'Noto Sans KR', sans-serif;
    height: 100%;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, rgba(255,255,255,.5) 50%, transparent 50%),
      radial-gradient(1.5px 1.5px at 80% 10%, rgba(255,255,255,.4) 50%, transparent 50%),
      radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,.35) 50%, transparent 50%),
      radial-gradient(1.5px 1.5px at 30% 85%, rgba(255,255,255,.4) 50%, transparent 50%),
      radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,.3) 50%, transparent 50%),
      radial-gradient(1.5px 1.5px at 45% 40%, rgba(255,255,255,.3) 50%, transparent 50%);
    background-size: 600px 600px;
    pointer-events:none;
    z-index:0;
  }
  .font-display{ font-family:'Jua', sans-serif; }

  .app{
    position:relative; z-index:1;
    max-width: 1380px;
    height: 100vh;
    margin: 0 auto;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
  }

  /* ===== Header ===== */
  .masthead{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap: 16px; margin-bottom: 12px; flex-wrap: wrap; flex: none;
    border-bottom: 1px solid rgba(233,236,255,.14);
    padding-bottom: 10px;
  }
  .masthead h1{
    font-family:'Jua', sans-serif;
    font-size: clamp(19px, 2.4vw, 25px);
    margin: 0 0 3px;
    letter-spacing: .5px;
  }
  .masthead p{ margin:0; color: var(--star-dim); font-size: 12px; }
  .badge-log-no{
    font-size: 10px; letter-spacing: 1px; color: var(--star-dim);
    border: 1px solid rgba(233,236,255,.2); border-radius: 999px;
    padding: 3px 10px;
  }
  .masthead-actions{ display:flex; align-items:center; gap:8px; }
  .sound-toggle{
    width:36px; height:36px; border-radius:50%; border:1px solid rgba(233,236,255,.24);
    background:rgba(233,236,255,.08); color:var(--star); font-size:18px;
    display:grid; place-items:center; cursor:pointer;
  }
  .sound-toggle:hover{ background:rgba(233,236,255,.15); }
  .sound-toggle.muted{ color:var(--star-dim); opacity:.7; }

  /* ===== Layout: tablet-landscape first ===== */
  .layout{
    display:grid;
    grid-template-columns: 286px minmax(0,1fr);
    gap: 14px;
    align-items: stretch;
    flex: 1;
    min-height: 0;
  }
  @media (max-width: 880px){
    .app{ height: auto; min-height: 100vh; }
    .layout{ grid-template-columns: 1fr; }
  }

  .side-panel{
    display:flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
  }

  /* ===== Player rail ===== */
  .rail{
    display:flex;
    flex-direction: column;
    gap:9px;
    min-height: 0;
    overflow-y: auto;
    max-height: 39vh;
  }
  @media (max-width: 880px){
    .side-panel{ min-height:auto; }
    .rail{ flex-direction: row; flex-wrap: wrap; }
    .rail .player-card{ flex: 1 1 45%; }
  }
  .player-card{
    background: linear-gradient(180deg, var(--ink-3), var(--ink-2));
    border: 1px solid rgba(233,236,255,.1);
    border-radius: 12px;
    padding: 10px 12px;
    position: relative;
    flex: none;
    transition: box-shadow .25s ease, border-color .25s ease;
  }
  .player-card.active{
    border-color: var(--player-color, var(--amber));
    box-shadow: 0 0 0 1px var(--player-color, var(--amber)), 0 8px 24px -8px var(--player-color, var(--amber));
  }
  .player-card.bankrupt{ opacity:.4; filter: grayscale(1); }
  .player-top{ display:flex; align-items:center; gap:8px; margin-bottom:5px;}
  .player-dot{ width:12px; height:12px; border-radius:50%; background:var(--player-color); flex:none; box-shadow: 0 0 10px var(--player-color);}
  .player-name{ font-weight:700; font-size:14.5px; flex:1; }
  .player-turn-tag{
    font-size:9.5px; color: var(--ink); background: var(--amber);
    padding: 2px 7px; border-radius: 999px; font-weight:700; display:none;
  }
  .player-card.active .player-turn-tag{ display:inline-block; }
  .player-finance{
    display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:6px;
    margin:7px 0 8px;
  }
  .finance-part{
    min-width:0; padding:6px 8px; border:1px solid rgba(233,236,255,.1);
    border-radius:6px; background:rgba(255,255,255,.045);
  }
  .finance-label{ display:block; color:var(--star-dim); font-size:10.5px; margin-bottom:2px; }
  .finance-rate{ color:var(--amber); font-size:9.5px; font-weight:700; }
  .finance-value{
    display:block; font-family:'Jua'; font-size:17px; color:var(--star);
    white-space:nowrap;
  }
  .finance-total{
    grid-column:1 / -1; display:flex; align-items:baseline; justify-content:space-between;
    gap:8px; padding:7px 9px; border:1px solid rgba(232,163,61,.42);
    border-radius:6px; background:rgba(232,163,61,.12);
  }
  .finance-total .finance-label{ margin:0; color:#FFE29B; font-size:13px; font-weight:700; }
  .finance-total .finance-value{ color:var(--amber); font-size:22px; }
  .player-owned{ display:flex; flex-wrap:wrap; gap:4px; min-height: 16px;}
  .owned-chip{
    font-size: 10.8px; padding: 2px 6px; border-radius: 999px;
    background: rgba(255,255,255,.08); color: var(--star);
    border: 1px solid rgba(255,255,255,.1);
  }
  .player-status{ font-size: 10.5px; color: var(--bad); margin-top:4px; min-height:13px;}

  .setup-box{
    background: rgba(255,255,255,.03);
    border: 1px dashed rgba(233,236,255,.25);
    border-radius: 14px; padding: 16px;
  }
  .setup-box h3{ margin:0 0 10px; font-family:'Jua'; font-size:15px;}
  .setup-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .setup-row input[type=text]{
    flex:1; background: #fff; border: 1px solid var(--paper-line);
    border-radius: 8px; padding: 8px 11px; color: #2A2110; font-size:13.5px;
  }
  .setup-row input[type=text]::placeholder{ color: #9c8f68; }
  .setup-row input[type=text]:focus{ outline: 2px solid var(--amber); outline-offset: 1px; }
  .setup-row .swatch{ width:22px;height:22px;border-radius:50%; flex:none; border: 2px solid rgba(42,33,16,.3);}
  .remove-player{
    width:34px; height:34px; flex:none; border:1px solid rgba(42,33,16,.28);
    border-radius:50%; background:rgba(42,33,16,.07); color:#6b6046;
    font-size:20px; line-height:1; cursor:pointer;
  }
  .remove-player:hover{ background:#F4D2D9; color:#9E2840; }
  .btn{
    font-family:'Jua'; cursor:pointer; border:none; border-radius: 10px;
    padding: 10px 16px; font-size: 14px; transition: transform .12s ease, filter .12s ease;
  }
  .btn:active{ transform: scale(.96); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-amber{ background: linear-gradient(180deg, var(--amber), var(--amber-deep)); color: #2B1A00; }
  .btn-amber:hover:not(:disabled){ filter:brightness(1.08); }
  .btn-ghost{ background: rgba(42,33,16,.08); color:#2A2110; border: 1px solid rgba(42,33,16,.28); }
  .btn-ghost:hover{ background: rgba(42,33,16,.15); }
  .btn-block{ width:100%; }

  /* ===== Board ===== */
  .board-wrap{
    background: radial-gradient(ellipse at center, #0E1740 0%, #070B1E 100%);
    border: 1px solid rgba(233,236,255,.12);
    border-radius: 16px;
    padding: 8px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    min-width: 0;
    overflow: hidden;
  }
  .board{
    display:grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 4px;
    aspect-ratio: 3/2;
    position: relative;
    max-width: 100%;
    max-height: 100%;
  }
  .tile{
    border-radius: 7px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(233,236,255,.08);
    position: relative;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding: 2px;
    overflow:hidden;
    cursor: default;
  }
  .tile .tk{ font-size: 10.5px; font-weight:700; text-align:center; line-height:1.16; color: var(--star); }
  .tile .ti{ font-size: 17px; margin-bottom:1px; }
  .tile.planet{ border-bottom: 3px solid var(--planet-color); }
  .tile.planet .tk{ color: #fff; }
  .tile.body{ background: rgba(111,207,151,.1); border-color: rgba(111,207,151,.35); }
  .tile.quiz{ background: rgba(232,163,61,.1); border-color: rgba(232,163,61,.35); }
  .tile.mission{ background: rgba(224,99,122,.12); border-color: rgba(224,99,122,.36); }
  .tile.corner{ background: rgba(255,255,255,.06); }
  .tile .owner-flag{
    position:absolute; top:3px; right:3px; width:11px; height:11px; border-radius:50%;
    box-shadow: 0 0 4px rgba(0,0,0,.6);
  }
  .tile .stage-badge{
    position:absolute; top:2px; left:3px;
    font-size: 8.5px; font-weight:900; color:#fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.7);
  }
  .tile.planet .tk{
    position:absolute; left:3px; bottom:3px; z-index:2;
    padding:2px 4px; border-radius:4px; background:rgba(5,8,22,.84);
    text-shadow:0 1px 2px #000;
  }
  .tile .price-tag{
    position:absolute; right:3px; bottom:3px; z-index:2;
    padding:2px 4px; border-radius:4px; background:rgba(232,163,61,.92);
    color:#241600; font-size:9.5px; font-weight:900; line-height:1.15;
    box-shadow:0 1px 4px rgba(0,0,0,.45);
  }
  .planet-photo{
    display:block; width:min(54px, 84%); height:calc(100% - 12px); max-height:52px;
    margin-bottom:10px;
    object-fit:contain; filter:drop-shadow(0 2px 5px rgba(0,0,0,.72));
  }
  .planet-photo.saturn{ width:min(64px, 96%); }
  .body-photo{
    display:block; width:min(52px, 84%); height:46px; margin-bottom:2px;
    object-fit:contain; filter:drop-shadow(0 2px 5px rgba(0,0,0,.72));
  }
  .body-photo.sun{ filter:drop-shadow(0 0 7px rgba(255,224,139,.5)); }
  .modal-planet-photo{
    width:42px; height:42px; object-fit:contain; vertical-align:middle;
    margin-right:5px; filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));
  }
  .choice-planet-photo{
    width:32px; height:32px; object-fit:contain; vertical-align:middle;
    margin-right:8px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));
  }
  .board-center{
    grid-column: 2 / 9; grid-row: 2 / 6;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 14px;
    background: radial-gradient(circle, rgba(232,163,61,.06), transparent 70%);
    border-radius: 12px;
  }
  .center-title{ font-family:'Jua'; font-size: clamp(16px,2vw,22px); color: var(--star-dim); text-align:center; letter-spacing:1px;}
  .dice-row{ display:flex; gap:18px; }
  .die{
    width: 70px; height:70px; border-radius: 14px;
    background: linear-gradient(160deg,#fff,#dcdcec);
    box-shadow: 0 6px 16px rgba(0,0,0,.4);
    display:grid;
    grid-template-columns: repeat(3,1fr);
    grid-template-rows: repeat(3,1fr);
    grid-template-areas:
      "tl .  tr"
      "ml mc mr"
      "bl .  br";
    gap: 2px;
    padding: 11px;
  }
  .die.rolling{ animation: dieShake .11s linear infinite; }
  @keyframes dieShake{
    0%{ transform: rotate(0deg) scale(1); }
    50%{ transform: rotate(10deg) scale(1.06); }
    100%{ transform: rotate(-10deg) scale(1); }
  }
  .pip{
    width: 11px; height:11px; border-radius:50%;
    background:#1E2333; align-self:center; justify-self:center;
    opacity:0; transform: scale(.4); transition: opacity .08s ease, transform .08s ease;
  }
  .pip.on{ opacity:1; transform: scale(1); }
  .pip-tl{ grid-area: tl; } .pip-tr{ grid-area: tr; }
  .pip-ml{ grid-area: ml; } .pip-mc{ grid-area: mc; } .pip-mr{ grid-area: mr; }
  .pip-bl{ grid-area: bl; } .pip-br{ grid-area: br; }
  #turnPrompt{ width:100%; text-align:center; }
  #rollBtn{
    min-width: 250px;
    padding: 14px 24px;
    font-size: 20px;
    box-shadow: 0 7px 16px rgba(0,0,0,.28);
  }
  .turn-log{
    width: 100%;
    background: rgba(0,0,0,.3);
    border-radius: 10px; padding: 10px 12px;
    font-size: 13.5px; color: var(--star-dim);
    max-height: 230px; overflow-y:auto;
    border: 1px solid rgba(233,236,255,.08);
  }
  .turn-log div{ margin-bottom:3px; }
  .turn-log div:first-child{ color: var(--star); }

  .token{
    position:absolute; width: 18px; height:18px; border-radius:50%;
    border: 2px solid rgba(255,255,255,.85);
    transition: top .34s ease, left .34s ease, transform .22s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,.5);
    z-index: 5;
  }
  .token.moving{
    transform: scale(1.25);
    box-shadow: 0 0 0 4px rgba(255,255,255,.14), 0 4px 13px rgba(0,0,0,.55);
  }

  /* ===== Side tool panel ===== */
  .journal{
    background: linear-gradient(180deg, rgba(29,38,80,.96), rgba(20,27,60,.96));
    color: var(--star);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 14px 30px -14px rgba(0,0,0,.6);
    min-height: 0;
    flex: 1 1 auto;
    overflow-y: hidden;
    display:flex;
    flex-direction:column;
    gap: 12px;
  }
  .journal-tab{
    font-family:'Jua'; font-size: 11px; letter-spacing:2px; color: var(--amber);
    margin-bottom: 6px;
  }
  .journal h2{ font-family:'Jua'; margin: 0; font-size: 21px; color:var(--star); }
  .journal-empty{ font-size: 13px; color:var(--star-dim); line-height:1.7; }
  .planet-visual{
    display:block; width:min(260px, 86%); height:150px; margin:6px auto 16px;
    object-fit:contain; filter:drop-shadow(0 8px 14px rgba(0,0,0,.45));
  }
  .body-visual{
    display:block; width:min(240px, 82%); height:138px; margin:6px auto 16px;
    object-fit:contain; filter:drop-shadow(0 8px 14px rgba(0,0,0,.45));
  }
  .card-field{ margin-bottom: 10px; }
  .card-field .lb{ font-size: 12px; color:#8a7c52; font-weight:700; margin-bottom:2px;}
  .card-field .vl{ font-size: 15.5px; line-height:1.55; }
  .card-divider{ border:none; border-top:1px dashed var(--paper-line); margin: 12px 0; }
  .quiz-opt{
    display:block; width:100%; text-align:left; background: rgba(255,255,255,.5);
    border: 1px solid var(--paper-line); border-radius: 8px; padding: 9px 12px;
    margin-bottom: 7px; font-size: 13.5px; cursor:pointer; color:#2A2110;
    font-family:'Noto Sans KR';
  }
  .quiz-opt:hover{ background: #fff; }
  .quiz-opt.correct{ background:#CDEBD6; border-color:#6FCF97; }
  .quiz-opt.wrong{ background:#F4D2D9; border-color:#E0637A; }
  .answer-box{
    background: rgba(255,255,255,.55);
    border: 1px dashed var(--paper-line);
    border-radius: 10px;
    padding: 10px 12px;
    margin: 10px 0 12px;
    font-size: 14px;
    line-height: 1.6;
    text-align: left;
  }
  .golden-key-card{
    background: linear-gradient(160deg, #FFF3A3, #E8A33D 58%, #B86C17);
    border: 2px solid #8f5314;
    border-radius: 14px;
    padding: 18px;
    margin: 10px 0 16px;
    color:#2B1A00;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 10px 24px rgba(0,0,0,.22);
  }
  .golden-choice-grid{
    display:grid; grid-template-columns:repeat(3, minmax(0, 1fr));
    gap:10px; margin:14px 0 18px; perspective:900px;
  }
  .golden-choice{
    min-width:0; height:176px; border:0; padding:0; background:transparent;
    cursor:pointer; perspective:900px;
  }
  .golden-choice:disabled{ cursor:default; opacity:.62; }
  .golden-choice.flipped{ opacity:1; }
  .golden-choice-inner{
    position:relative; display:block; width:100%; height:100%;
    transform-style:preserve-3d; transition:transform .65s ease;
  }
  .golden-choice.flipped .golden-choice-inner{ transform:rotateY(180deg); }
  .golden-choice-face{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:12px;
    border:2px solid #8f5314; border-radius:10px;
    backface-visibility:hidden; box-shadow:0 9px 20px rgba(0,0,0,.2);
  }
  .golden-choice-back{
    background:linear-gradient(145deg, #36200D, #9B5C18 55%, #3C210C);
    color:#FFE58D;
  }
  .golden-choice-back .key-mark{ font-size:42px; margin-bottom:8px; }
  .golden-choice-back b{ font-family:'Jua'; font-size:15px; }
  .golden-choice-front{
    transform:rotateY(180deg);
    background:linear-gradient(160deg, #FFF3A3, #E8A33D 58%, #B86C17);
    color:#2B1A00; font-size:12.5px; line-height:1.45;
  }
  .golden-choice-front b{ font-family:'Jua'; font-size:16px; margin-bottom:8px; }
  .choice-grid{
    display:grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin: 8px 0 14px;
  }
  .choice-grid.three{ grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .choice-grid.order-grid{
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 5px;
    margin: 6px 0 10px;
  }
  .record-choice{
    border: 1px solid var(--paper-line);
    background: rgba(255,255,255,.55);
    color:#2A2110;
    border-radius: 10px;
    padding: 10px 8px;
    font-family:'Jua';
    font-size: 14px;
    cursor:pointer;
  }
  .order-grid .record-choice{
    padding: 8px 4px;
    border-radius: 8px;
    font-size: 13px;
  }
  .record-choice.selected{
    background: linear-gradient(180deg, var(--amber), var(--amber-deep));
    border-color: #8f5314;
    color:#2B1A00;
    box-shadow: 0 0 0 2px rgba(232,163,61,.2);
  }
  .record-choice.correct{
    background:#CDEBD6;
    border-color:#6FCF97;
  }
  .record-choice.wrong{
    background:#F4D2D9;
    border-color:#E0637A;
  }
  .journal-record{
    text-align:left;
    background: rgba(255,255,255,.58);
    border:1px solid var(--paper-line);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size:14px;
    line-height:1.55;
  }

  /* ===== Modal ===== */
  .modal-backdrop{
    position:fixed; inset:0; background: rgba(4,6,20,.72);
    display:flex; align-items:center; justify-content:center;
    z-index: 80; padding: 20px;
  }
  .modal-card{
    background: var(--paper);
    background-image: repeating-linear-gradient(var(--paper) 0px, var(--paper) 27px, var(--paper-line) 28px);
    color:#2A2110; border-radius: 16px; padding: 26px;
    width: 100%; max-width: 540px; max-height:calc(100vh - 40px); overflow-y:auto;
    box-shadow: 0 24px 60px -18px rgba(0,0,0,.7);
    text-align:center;
  }
  .modal-card h3{ font-family:'Jua'; font-size:22px; margin:4px 0 10px;}
  .modal-card p{ font-size: 15.5px; line-height:1.6; margin: 0 0 16px; color:#4a3f22;}
  .modal-amount{ font-family:'Jua'; font-size: 34px; margin: 6px 0 16px;}
  .modal-amount.pos{ color:#2E9E5B; }
  .modal-amount.neg{ color:#C43A55; }

  .setup-gate{
    position:fixed; inset:0; z-index:60; background: var(--ink);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .gate-card{
    background: var(--paper);

<div class="app">
  <header class="masthead">
    <div>
      <h1>🛰️ 밤하늘 관찰 원정대</h1>
      <p>교과서 「과학」 1단원 밤하늘 관찰 · 태양계 말판 놀이</p>
    </div>
    <div class="masthead-actions">
      <div class="badge-log-no">EXPEDITION LOG · 1단원 밤하늘 관찰</div>
      <button type="button" class="sound-toggle" id="soundToggle" aria-label="소리 끄기" title="소리 끄기">🔊</button>
    </div>
  </header>

  <div class="layout">
    <!-- LEFT: dashboard + journal -->
    <aside class="side-panel">
      <div class="rail" id="rail"></div>

      <section class="journal" id="journalTools">
        <div>
          <div class="journal-tab">EXPEDITION LOG</div>
          <h2>탐사 로그</h2>
        </div>
        <div class="turn-log" id="turnLog"><div>탐사 기록이 이곳에 표시됩니다.</div></div>
        <button class="btn btn-amber btn-block" id="openJournalBtn">관측기록장 열어보기</button>
      </section>
    </aside>

    <!-- CENTER: board -->
    <section class="board-wrap">
      <div class="board" id="board"></div>
    </section>
  </div>
</div>

<!-- setup gate -->
<div class="setup-gate" id="setupGate">
  <div class="gate-card">
    <h2>🚀 원정대 편성</h2>
    <div class="sub">2~6명의 탐험가 이름을 입력하세요</div>
    <div id="setupRows"></div>
    <button class="btn btn-ghost" id="addPlayerBtn" style="margin-bottom:14px;">+ 탐험가 추가</button>
    <div class="game-mode-box">
      <div class="game-mode-label">게임 종료 조건</div>
      <div class="mode-tabs">
        <button type="button" class="mode-tab selected" data-mode="laps">바퀴 수</button>
        <button type="button" class="mode-tab" data-mode="timer">제한 시간</button>
      </div>
      <div class="mode-config active" data-config="laps">
        <label for="lapsTarget">완주 후 차례 횟수를 맞추고 총자산 승리</label>
        <div class="lap-stepper">
          <button type="button" id="lapsMinus" aria-label="바퀴 수 줄이기">−</button>
          <output id="lapsOutput" for="lapsTarget">5바퀴</output>
          <button type="button" id="lapsPlus" aria-label="바퀴 수 늘리기">+</button>
          <input type="hidden" id="lapsTarget" value="5">
        </div>
      </div>
      <div class="mode-config" data-config="timer">
        <label for="timerTarget">시간 종료 후 총자산 순위</label>
        <select id="timerTarget"><option value="10">10분</option><option value="12" selected>12분</option><option value="15">15분</option></select>
      </div>
    </div>
    <button class="btn btn-amber btn-block" id="startGameBtn">탐사 시작하기</button>
  </div>
</div>

<!-- generic modal -->
<div class="modal-backdrop" id="modalBackdrop" style="display:none;">

</div>

/* index -> {row,col} on 9x6 perimeter, start = bottom-left, counter-clockwise */
function indexToRC(i){
  const leftEnd = BOARD_ROWS - 1;
  const topEnd = leftEnd + BOARD_COLS - 1;
  const rightEnd = topEnd + BOARD_ROWS - 1;
  if(i>=0 && i<=leftEnd) return {row:leftEnd-i, col:0};
  if(i>leftEnd && i<=topEnd) return {row:0, col:i-leftEnd};
  if(i>topEnd && i<=rightEnd) return {row:i-topEnd, col:BOARD_COLS-1};
  if(i>rightEnd && i<BOARD_TILE_COUNT) return {row:BOARD_ROWS-1, col:(BOARD_COLS-1)-(i-rightEnd)};
  return {row:leftEnd,col:0};
}

function ensureAudio(){
  if(!soundEnabled) return;
  if(!audioContext){
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if(!AudioContextClass) return;
    audioContext = new AudioContextClass();
    soundMaster = audioContext.createGain();
    soundMaster.gain.value = .28;
    soundMaster.connect(audioContext.destination);
  }
  if(audioContext.state === 'suspended') audioContext.resume();
  if(!ambientStarted) startSpaceAmbient();
}

function startSpaceAmbient(){
  if(!audioContext || ambientStarted) return;
  ambientStarted = true;
  const ambientGain = audioContext.createGain();
  const filter = audioContext.createBiquadFilter();
  ambientGain.gain.value = .055;
  filter.type = 'lowpass';
  filter.frequency.value = 420;
  ambientGain.connect(filter);
  filter.connect(soundMaster);
  [55, 82.5, 110].forEach((frequency,index)=>{
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    oscillator.type = index === 0 ? 'sine' : 'triangle';
    oscillator.frequency.value = frequency;
    gain.gain.value = index === 0 ? .7 : .18;
    oscillator.connect(gain);
    gain.connect(ambientGain);
    oscillator.start();
  });
  const lfo = audioContext.createOscillator();
  const lfoGain = audioContext.createGain();
  lfo.frequency.value = .08;
  lfoGain.gain.value = .018;
  lfo.connect(lfoGain);
  lfoGain.connect(ambientGain.gain);
  lfo.start();
}

function playTone(frequency, duration=.15, type='sine', volume=.12, delay=0){
  if(!soundEnabled) return;
  ensureAudio();
  if(!audioContext || !soundMaster) return;
  const start = audioContext.currentTime + delay;
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();
  oscillator.type = type;
  oscillator.frequency.setValueAtTime(frequency, start);
  gain.gain.setValueAtTime(0, start);
  gain.gain.linearRampToValueAtTime(volume, start + .015);
  gain.gain.exponentialRampToValueAtTime(.001, start + duration);
  oscillator.connect(gain);
  gain.connect(soundMaster);
  oscillator.start(start);
  oscillator.stop(start + duration + .03);
}

function playSound(name, value=0){
  if(name === 'dice'){
    [180,240,310].forEach((frequency,index)=>playTone(frequency,.11,'square',.045,index*.07));
  } else if(name === 'move'){
    playTone(430 + (value%6)*35,.09,'sine',.075);
  } else if(name === 'arrival'){
    playTone(392,.2,'triangle',.1); playTone(587,.3,'sine',.08,.1);
  } else if(name === 'toll'){
    playTone(220,.2,'sawtooth',.07); playTone(165,.3,'triangle',.08,.12);
  } else if(name === 'correct'){
    playTone(523,.16,'sine',.1); playTone(659,.2,'sine',.1,.1); playTone(784,.28,'sine',.09,.2);
  } else if(name === 'wrong'){
    playTone(330,.18,'triangle',.1); playTone(220,.3,'triangle',.09,.12);
  } else if(name === 'golden'){
    [659,880,1047].forEach((frequency,index)=>playTone(frequency,.35,'sine',.075,index*.09));
  } else if(name === 'build'){
    playTone(196,.25,'triangle',.1); playTone(392,.35,'sine',.09,.13); playTone(587,.4,'sine',.08,.25);
  } else if(name === 'victory'){
    [523,659,784,1047].forEach((frequency,index)=>playTone(frequency,.45,'sine',.09,index*.13));
  }
}

function shuffleQuestions(items){
  const shuffled = [...items];
  for(let i=shuffled.length-1;i>0;i--){
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

      <button class="btn btn-ghost" style="flex:1;" id="backToSetup">이름 수정</button>
      <button class="btn btn-amber" style="flex:1;" id="confirmStart">시작</button>
    </div>
  `, {closable:false});
  document.getElementById('backToSetup').onclick = closeModal;
  document.getElementById('confirmStart').onclick = ()=>{
    ensureAudio();
    closeModal();
    beginGame(names, rule);
  };
}

function beginGame(names, rule){
  gameRule = rule;
  gameOver = false;
  timeExpired = false;
  roundEndPending = null;
  players = names.map((name,i)=>({
    name, color: PLAYER_COLORS[i], money: 1500, position: 0, laps:0, turnCount:0,
    owned: [], baseStages: {}, tollPasses:0, quizShields:0, successPasses:0,
    blackHolePasses:0, baseValueMultiplier:1, jailTurns:0, bankrupt:false, skipTurn:false
  }));
  currentIdx = 0;
  observationRecords = {};
  bodyObservationRecords = {};
  quizDeck = [];
  escapeQuizDeck = [];
  document.getElementById('setupGate').style.display = 'none';
  renderBoard();
  renderRail();
  logMsg(`🚀 ${players.length}명의 원정대가 출발지에서 탐사를 시작합니다!`, true);
  logMsg(`🏁 종료 조건: ${ruleDescription(gameRule)}`);
  startGameClock();
  renderTurnPrompt();
}

function startGameClock(){
  if(timerId) clearInterval(timerId);
  if(gameRule.type !== 'timer'){
    updateGameStatus();
    return;
  }
  gameEndsAt = Date.now() + gameRule.target * 60 * 1000;
  timerId = setInterval(()=>{
    if(gameOver){ clearInterval(timerId); return; }
    if(Date.now() >= gameEndsAt){
      timeExpired = true;
      clearInterval(timerId);
      requestRoundEnd('제한 시간이 끝났습니다. 현금과 기지 가치를 합친 총자산으로 순위를 정했습니다.');
      updateGameStatus();
      return;
    }
    updateGameStatus();
  }, 1000);
  updateGameStatus();
}

function updateGameStatus(){
  const status = document.getElementById('gameStatus');
  if(!status) return;
  if(roundEndPending){
    status.textContent = roundEndPending.type === 'laps'
      ? `종료 조건 달성 · 전원 ${roundEndPending.targetTurnCount}차례까지 진행`
      : '시간 종료 · 마지막 순서까지 진행';
    return;
  }
  if(gameRule.type === 'laps'){
    status.textContent = `종료 목표 · ${gameRule.target}바퀴 완주 시 총자산 비교`;
    return;
  }
  if(timeExpired){
    status.textContent = '시간 종료 · 현재 행동 마무리 중';
    return;
  }
  const left = Math.max(0, gameEndsAt - Date.now());
  const minutes = Math.floor(left / 60000);
  const seconds = Math.floor((left % 60000) / 1000);
  status.textContent = `남은 시간 · ${minutes}:${String(seconds).padStart(2,'0')}`;
}

/* ============ BOARD SIZING (fit tablet-landscape viewport) ============ */
function sizeBoard(){
  const wrap = document.querySelector('.board-wrap');
  const board = document.getElementById('board');
  if(!wrap || !board) return;
  const w = wrap.clientWidth - 4;
  const h = wrap.clientHeight - 4;
  const aspect = BOARD_COLS / BOARD_ROWS;
  let boardW = w;
  let boardH = boardW / aspect;
  if(boardH > h){
    boardH = h;
    boardW = boardH * aspect;
  }
  board.style.width = Math.max(300, boardW) + 'px';
  board.style.height = Math.max(190, boardH) + 'px';
}
window.addEventListener('resize', sizeBoard);

/* ============ RENDER: BOARD ============ */
const boardEl = document.getElementById('board');
function renderBoard(){

      </div>

function tileVisualHTML(d){
  if(d.type === 'planet'){
    const saturnClass = d.planet.key === 'saturn' ? ' saturn' : '';
    return `<img class="planet-photo${saturnClass}" src="${d.planet.image}" alt="${d.planet.name} 실제 관측 사진">`;
  }
  if(d.type === 'body'){
    const sunClass = d.body.key === 'sun' ? ' sun' : '';
    return `<img class="body-photo${sunClass}" src="${d.body.image}" alt="${d.body.name} 실제 관측 사진">`;
  }
  return `<div class="ti">${d.icon}</div>`;
}

function renderTileMarkers(){
  document.querySelectorAll('.owner-flag,.stage-badge').forEach(el=>el.remove());
  PLANET_SLOTS.forEach((slot)=>{
    const planet = BOARD[slot].planet;
    const ownerIdx = getOwnerIndex(planet.key);
    if(ownerIdx === -1) return;
    const tile = document.getElementById('tile-'+slot);
    if(!tile) return;
    const owner = players[ownerIdx];
    const flag = document.createElement('span');
    flag.className = 'owner-flag';
    flag.style.background = owner.color;
    tile.appendChild(flag);
    const stage = document.createElement('span');
    stage.className = 'stage-badge';
    stage.textContent = `${getBaseStage(owner, planet.key)}단계`;
    tile.appendChild(stage);
  });
}

function renderTokens(){
  const liveTokens = new Set();
  players.forEach((p, pi)=>{
    if(p.bankrupt) return;
    let token = document.getElementById('token-'+pi);
    if(!token){
      token = document.createElement('div');
      token.className = 'token';
      token.id = 'token-'+pi;
      token.style.background = p.color;
      boardEl.appendChild(token);
    }
    liveTokens.add(token.id);
    placeToken(token, p.position, pi);
  });
  document.querySelectorAll('.token').forEach(token=>{
    if(!liveTokens.has(token.id)) token.remove();
  });
}

function placeToken(token, position, playerIndex){
  const {row,col} = indexToRC(position);
  const cellW = 100 / BOARD_COLS;
  const cellH = 100 / BOARD_ROWS;
  const offsets = [[3,3],[3,25],[3,47],[25,3],[25,25],[25,47]];
  const off = offsets[playerIndex];
  token.style.top = `calc(${row * cellH}% + ${off[0]}px)`;
  token.style.left = `calc(${col * cellW}% + ${off[1]}px)`;
}

function logMsg(msg){
  const log = document.getElementById('turnLog');
  if(!log) return;
  const line = document.createElement('div');
  line.textContent = msg;
  log.prepend(line);
  while(log.children.length > 5) log.removeChild(log.lastChild);

/* ============ DICE (pip faces + rolling animation) ============ */
const DIE_PIPS = {
  1: ['mc'],
  2: ['tl','br'],
  3: ['tl','mc','br'],
  4: ['tl','tr','bl','br'],
  5: ['tl','tr','mc','bl','br'],
  6: ['tl','tr','ml','mr','bl','br'],
};
function setDieFace(el, value){
  const on = new Set(DIE_PIPS[value] || []);
  el.querySelectorAll('.pip').forEach(pip=>{
    const area = Array.from(pip.classList).find(c=>c.startsWith('pip-')).slice(4);
    pip.classList.toggle('on', on.has(area));
  });
}
function animateDice(el1, el2, final1, final2, duration, onDone){
  el1.classList.add('rolling');
  el2.classList.add('rolling');
  const spin = setInterval(()=>{
    setDieFace(el1, 1+Math.floor(Math.random()*6));
    setDieFace(el2, 1+Math.floor(Math.random()*6));
  }, 90);
  setTimeout(()=>{
    clearInterval(spin);
    el1.classList.remove('rolling');
    el2.classList.remove('rolling');
    setDieFace(el1, final1);
    setDieFace(el2, final2);
    onDone && onDone();
  }, duration);
}

/* ============ TURN PROMPT / DICE ============ */
function currentPlayer(){ return players[currentIdx]; }

function renderTurnPrompt(){
  const el = document.getElementById('turnPrompt');
  if(!el) return;
  const p = currentPlayer();
  if(gameOver){ el.innerHTML = ''; return; }
  el.innerHTML = `<button class="btn btn-amber" id="rollBtn">🎲 ${p.name}, 주사위 굴리기</button>`;
  document.getElementById('rollBtn').addEventListener('click', handleRoll);
}

function nextTurn(){
  if(gameOver) return;
  if(roundEndPending?.type === 'timer' && currentIdx >= roundEndPending.endIndex){
    endGame(roundEndPending.reason, roundEndPending.winner);
    return;
  }
  if(roundEndPending?.type === 'laps' && turnCountsAligned()){
    endGame(roundEndPending.reason);
    return;
  }
  doublesStreak = 0;
  let attempts = 0;
  do{
    currentIdx = (currentIdx+1) % players.length;
    attempts++;
  } while((players[currentIdx].bankrupt ||
    (roundEndPending?.type === 'laps' && players[currentIdx].turnCount >= roundEndPending.targetTurnCount)) &&
    attempts <= players.length);
  if(roundEndPending?.type === 'laps' && attempts > players.length){
    endGame(roundEndPending.reason);
    return;
  }
  if(players[currentIdx]?.skipTurn){
    const p = players[currentIdx];
    p.skipTurn = false;
    logMsg(`💫 ${p.name}은(는) 관측 기록 정리로 이번 차례를 쉽니다.`);
    renderRail();
    setTimeout(nextTurn, 600);
    return;
  }
  renderRail();
  renderTurnPrompt();
}

function baseAssetValue(player){
  const investedValue = player.owned.reduce((sum, key)=>{
    const planet = PLANETS.find(item=>item.key === key);
    if(!planet) return sum;
    return sum + planet.price + (getBaseStage(player, key) === 2 ? upgradeCost(planet) : 0);
  }, 0);
  return Math.round(investedValue * (player.baseValueMultiplier || 1));
}

function totalAssets(player){
  return player.money + baseAssetValue(player);
}

function rankingForRule(){
  return [...players].sort((a,b)=>{
    return totalAssets(b) - totalAssets(a) || b.money - a.money;
  });
}

function rankingValue(player){
  return `${player.laps}바퀴 · 총자산 ${totalAssets(player).toLocaleString()}G`;
}

function endGame(reason, winner=null){
  if(gameOver) return true;
  playSound('victory');
  gameOver = true;
  if(timerId) clearInterval(timerId);
  const ranking = rankingForRule();
  const champion = winner || ranking[0];
  if(winner){
    const winnerIndex = ranking.indexOf(winner);
    if(winnerIndex > 0){ ranking.splice(winnerIndex, 1); ranking.unshift(winner); }
  }
  renderTurnPrompt();
  showModal(`
    <div class="win-icon">🏆</div>
    <h3>${champion.name} 원정대 승리!</h3>
    <p>${reason}</p>
    <div class="result-list">
      ${ranking.map((player,index)=>`
        <div class="result-row">
          <span>${index + 1}위</span>
          <span>${player.name}</span>
          <span>${rankingValue(player)}</span>
        </div>
      `).join('')}
    </div>
    <button class="btn btn-amber" onclick="location.reload()">새 탐사 시작</button>
  `, {closable:false});
  return true;
}

function lastActivePlayerIndex(){
  for(let i=players.length-1;i>=0;i--){
    if(!players[i].bankrupt) return i;
  }
  return players.length - 1;
}

function requestRoundEnd(reason, winner=null){
  if(roundEndPending) return;
  roundEndPending = {type:'timer', reason, winner, endIndex:lastActivePlayerIndex()};
  logMsg('🏁 종료 조건을 달성했습니다. 이번 순서의 마지막 참가자까지 진행합니다.');
  updateGameStatus();
}

function turnCountsAligned(){
  if(roundEndPending?.type !== 'laps') return false;
  return players
    .filter(player=>!player.bankrupt)
    .every(player=>player.turnCount >= roundEndPending.targetTurnCount);
}

function requestLapEnd(finisher){
  if(roundEndPending) return;
  const activePlayers = players.filter(player=>!player.bankrupt);
  const targetTurnCount = Math.max(...activePlayers.map(player=>player.turnCount));
  roundEndPending = {
    type:'laps',
    targetTurnCount,
    reason:`${finisher.name} 원정대가 ${gameRule.target}바퀴를 완주했습니다. 모든 참가자의 차례 횟수를 ${targetTurnCount}회로 맞춘 뒤 총자산으로 순위를 정했습니다.`,
  };
  logMsg(`🏁 ${finisher.name}이(가) 목표 바퀴를 완주했습니다. 모두 ${targetTurnCount}차례까지 진행한 뒤 종료합니다.`);
  updateGameStatus();
}

function checkWin(){
  if(timeExpired && !roundEndPending){
    requestRoundEnd('제한 시간이 끝났습니다. 현금과 기지 가치를 합친 총자산으로 순위를 정했습니다.');
  }
  if(gameRule.type === 'laps'){
    const finisher = players.find(player=>!player.bankrupt && player.laps >= gameRule.target);
    if(finisher && !roundEndPending) requestLapEnd(finisher);
  }
  const alive = players.filter(p=>!p.bankrupt);
  if(alive.length === 1 && players.length > 1){
    return endGame('다른 원정대가 모두 예산을 소진했습니다.', alive[0]);
  }
  if(roundEndPending?.type === 'timer' && currentIdx >= roundEndPending.endIndex){
    return endGame(roundEndPending.reason, roundEndPending.winner);
  }
  if(roundEndPending?.type === 'laps' && turnCountsAligned()) return endGame(roundEndPending.reason);
  return false;
}

function showBlackHoleEscapeQuiz(p){
  const q = drawEscapeOX();
  showModal(`
    <h3>🕳️ 블랙홀 탈출 O/X</h3>
    <p>${q.q}</p>
    <div id="escapeQuizOpts"></div>
    <div id="escapeExplanation" class="answer-box" style="display:none;"></div>
    <div id="escapeAction"></div>
  `, {closable:false});
  const options = document.getElementById('escapeQuizOpts');
  q.opts.forEach((option,index)=>{
    const button = document.createElement('button');
    button.className = 'quiz-opt';
    button.textContent = option;
    button.onclick = ()=>{
      Array.from(options.children).forEach(item=>item.onclick=null);
      const correct = index === q.a;
      button.classList.add(correct ? 'correct' : 'wrong');
      options.children[q.a].classList.add('correct');
      playSound(correct ? 'correct' : 'wrong');
      const explanation = document.getElementById('escapeExplanation');
      explanation.style.display = 'block';
      explanation.innerHTML = `<b>정답 ${q.opts[q.a]}</b> · ${q.explanation}`;
      if(correct){
        p.jailTurns = 0;
        logMsg(`🕳️ ${p.name}이(가) O/X 문제를 맞혀 블랙홀에서 탈출했습니다!`);
        document.getElementById('escapeAction').innerHTML = '<button class="btn btn-amber btn-block" id="escapeRoll">탈출하고 주사위 굴리기</button>';
        document.getElementById('escapeRoll').onclick = ()=>{ closeModal(); renderRail(); handleRoll(); };
      } else {
        p.jailTurns = Math.max(0, p.jailTurns - 1);
        const message = p.jailTurns > 0 ? `다음 차례에 다시 도전합니다. 남은 기회 ${p.jailTurns}번` : '블랙홀에서는 벗어났지만 이동은 다음 차례에 합니다.';
        logMsg(`🕳️ ${p.name}이(가) 탈출 문제를 틀렸습니다. ${message}`);
        document.getElementById('escapeAction').innerHTML = `<p>${message}</p><button class="btn btn-amber btn-block" id="escapeWait">다음 차례로</button>`;
        document.getElementById('escapeWait').onclick = ()=>{ closeModal(); renderRail(); nextTurn(); };
      }
    };
    options.appendChild(button);
  });
}

function handleRoll(){
  const rollBtn = document.getElementById('rollBtn');
  if(rollBtn) rollBtn.disabled = true;
  const p = currentPlayer();
  if(doublesStreak === 0) p.turnCount = (p.turnCount || 0) + 1;
  const die1 = document.getElementById('die1');
  const die2 = document.getElementById('die2');

  if(p.jailTurns > 0){
    if(p.blackHolePasses > 0){
      p.blackHolePasses--;
      p.jailTurns = 0;
      logMsg(`🚀 ${p.name}이(가) 블랙홀 비상 탈출 로켓을 사용해 즉시 탈출했습니다!`);
      renderRail();
    } else {
      showBlackHoleEscapeQuiz(p);
      return;
    }
  }

  playSound('dice');
  const d1 = 1+Math.floor(Math.random()*6);
  const d2 = 1+Math.floor(Math.random()*6);
  animateDice(die1, die2, d1, d2, 700, ()=>{
    if(d1 === d2){
      doublesStreak++;
      if(doublesStreak >= 3){
        logMsg(`💫 ${p.name}, 더블을 3번 연속! 블랙홀로 빨려 들어갑니다.`);
        p.position = 6;
        if(p.blackHolePasses > 0){
          p.blackHolePasses--;
          p.jailTurns = 0;
          logMsg(`🚀 ${p.name}이(가) 탈출 로켓을 사용해 블랙홀에서 즉시 벗어났습니다.`);
        } else {
          p.jailTurns = 3;
        }
        doublesStreak = 0;
        renderTokens();
        renderRail();
        setTimeout(nextTurn, 600);
        return;
      }
    }
    setTimeout(()=>{ movePlayer(p, d1+d2, d1===d2); }, 700);
  });
}

function movePlayer(p, steps, isDouble){
  const startPosition = p.position;
  const passedStart = (startPosition + steps) >= BOARD_TILE_COUNT;
  const playerIndex = players.indexOf(p);
  const token = document.getElementById('token-'+playerIndex);
  let moved = 0;

  if(token) token.classList.add('moving');
  logMsg(`🧭 ${p.name}이(가) ${steps}칸 이동합니다.`);

  function stepForward(){
    moved++;
    p.position = (p.position + 1) % BOARD_TILE_COUNT;
    renderTokens();
    playSound('move', moved);

    if(moved < steps){
      setTimeout(stepForward, MOVE_STEP_MS);
      return;
    }

    if(token) token.classList.remove('moving');
    if(passedStart){
      const previousRate = p.baseValueMultiplier || 1;
      const previousBaseValue = baseAssetValue(p);
      p.laps++;
      p.money += PASS_START_BONUS;
      p.baseValueMultiplier = Number((previousRate * 1.1).toFixed(6));
      const increasedBaseValue = baseAssetValue(p);
      logMsg(`🚩 ${p.name}이(가) ${p.laps}바퀴를 완주하고 연구 지원금 ${PASS_START_BONUS}G를 받았습니다.`);
      logMsg(`📈 ${p.name}의 기지 가치 지수가 10% 상승했습니다. (${Math.round(previousRate * 100)}% → ${Math.round(p.baseValueMultiplier * 100)}%)`);
      renderRail();
      setTimeout(()=>{
        showLapCompletionNotice(p, previousRate, previousBaseValue, increasedBaseValue, ()=>resolveTile(p, isDouble));
      }, ARRIVAL_PAUSE_MS);
      return;
    }
    renderRail();
    setTimeout(()=> resolveTile(p, isDouble), ARRIVAL_PAUSE_MS);
  }

  stepForward();
}

function showLapCompletionNotice(p, previousRate, previousBaseValue, increasedBaseValue, onDone){
  playSound('golden');
  const increase = increasedBaseValue - previousBaseValue;
  const assetMessage = p.owned.length
    ? `기지 자산 ${previousBaseValue.toLocaleString()}G → ${increasedBaseValue.toLocaleString()}G <b>(+${increase.toLocaleString()}G)</b>`
    : '현재 보유 기지는 없지만 이후 기지 자산 평가에 상승 지수가 적용됩니다.';
  showModal(`
    <h3>🚩 ${p.laps}바퀴 완주!</h3>
    <p><b>${p.name}</b> 원정대에 연구 지원금이 들어옵니다.</p>
    <div class="modal-amount pos">+${PASS_START_BONUS}G</div>
    <div class="answer-box">
      <b>기지 가치 지수 +10%</b><br>
      ${Math.round(previousRate * 100)}% → ${Math.round(p.baseValueMultiplier * 100)}%<br>
      ${assetMessage}
    </div>
    <button class="btn btn-amber btn-block" id="lapNoticeOk">도착 칸 확인</button>
  `, {closable:false});
  document.getElementById('lapNoticeOk').onclick = ()=>{
    closeModal();
    onDone();
  };
}

function movePlayerBackward(p, steps, isDouble){
  const playerIndex = players.indexOf(p);
  const token = document.getElementById('token-'+playerIndex);
  let moved = 0;
  if(token) token.classList.add('moving');
  logMsg(`🔧 ${p.name}이(가) 뒤로 ${steps}칸 이동합니다.`);

  function stepBackward(){
    moved++;
    p.position = (p.position - 1 + BOARD_TILE_COUNT) % BOARD_TILE_COUNT;
    renderTokens();
    playSound('move', moved);
    if(moved < steps){
      setTimeout(stepBackward, MOVE_STEP_MS);
      return;
    }
    if(token) token.classList.remove('moving');
    setTimeout(()=>resolveTile(p, isDouble), ARRIVAL_PAUSE_MS);
  }
  stepBackward();
}

/* ============ TILE RESOLUTION ============ */
function resolveTile(p, isDouble){
  const d = BOARD[p.position];
  if(d.type === 'planet'){
    const ownerIdx = getOwnerIndex(d.planet.key);
    const visitorIdx = players.indexOf(p);
    if(ownerIdx !== -1 && ownerIdx !== visitorIdx){
      playSound('toll');
      showPlanetTile(p, d, isDouble);
      return;
    }
  }
  showArrivalNotice(p, d, isDouble);
}

function showArrivalNotice(p, d, isDouble){
  renderJournal(null);
  playSound('arrival');
  const arrivalVisual = d.type === 'planet'
    ? `<img class="modal-planet-photo" src="${d.planet.image}" alt="${d.planet.name}">`
    : d.type === 'body'
      ? `<img class="modal-planet-photo" src="${d.body.image}" alt="${d.body.name}">`
      : d.icon;
  showModal(`
    <h3>${arrivalVisual} ${d.name} 도착</h3>
    <p>${arrivalText(p, d)}</p>
    <button class="btn btn-amber btn-block" id="arrivalNext">다음</button>
  `, {closable:false});
  document.getElementById('arrivalNext').onclick = ()=>{
    closeModal();
    continueTileAction(p, d, isDouble);
  };
}

function arrivalText(p, d){
  if(d.type === 'planet'){
    const ownerIdx = getOwnerIndex(d.planet.key);
    if(ownerIdx === -1) return `${d.planet.name}은(는) 아직 주인이 없는 행성입니다. 퀴즈 3문제 중 2문제 이상 맞히면 기지를 건설할 수 있습니다.`;
    const owner = players[ownerIdx];
    const stage = getBaseStage(owner, d.planet.key);
    if(owner === p && stage < 2) return `${d.planet.name}은(는) 나의 ${stage}단계 기지입니다. 퀴즈를 통과하면 2단계 기지로 진화할 수 있습니다.`;
    if(owner === p) return `${d.planet.name}은(는) 나의 2단계 기지입니다. 이미 최고 단계까지 진화했습니다.`;
    return `${d.planet.name}은(는) ${owner.name}의 ${stage}단계 기지입니다. 통행료 ${tollFor(d.planet, stage)}G가 필요합니다.`;
  }
  if(d.type === 'body') return `${d.body.name}의 특징을 관측 기록장에 정리합니다.`;
  if(d.type === 'quiz') return '태양계 구성원과 행성 특징을 확인하는 퀴즈로 이동합니다.';
  if(d.type === 'mission') return '말로 설명하고 정답 확인까지 할 수 있는 태양계 미션입니다.';
  if(d.type === 'blackhole') return '블랙홀에 빠졌습니다. 다음 차례에 행성 O/X 문제를 맞히면 바로 탈출할 수 있습니다.';
  return '출발지에 도착했습니다.';
}

function continueTileAction(p, d, isDouble){
  if(d.type === 'start'){
    logMsg(`🚩 ${p.name}이(가) 출발지에 도착했습니다.`);
    finishStep(p, isDouble);
  }
  else if(d.type === 'blackhole'){
    if(p.blackHolePasses > 0){
      p.blackHolePasses--;
      p.jailTurns = 0;
      logMsg(`🚀 ${p.name}이(가) 탈출 로켓을 사용해 블랙홀에서 즉시 벗어났습니다.`);
      renderRail();
      finishStep(p, isDouble);
    } else {
      logMsg(`🕳️ ${p.name}이(가) 블랙홀에 빠졌습니다. 다음 차례부터 O/X 탈출 문제에 도전합니다.`);
      p.jailTurns = 3;
      renderRail();
      setTimeout(nextTurn, 700);
    }
  }
  else if(d.type === 'planet'){
    if(!observationRecords[d.planet.key]){
      showObservationRecord(p, d.planet, ()=>showPlanetTile(p, d, isDouble));
    } else {
      showPlanetTile(p, d, isDouble);
    }
  }
  else if(d.type === 'body'){
    if(!bodyObservationRecords[d.body.key]){
      showBodyObservationRecord(p, d.body, ()=>showBodyTile(p, d, isDouble));
    } else {
      showBodyTile(p, d, isDouble);
    }
  }
  else if(d.type === 'quiz'){
    showQuizTile(p, isDouble);
  }
  else if(d.type === 'mission'){
    showMissionTile(p, d, isDouble);
  }
}

function finishStep(p, isDouble){
  renderJournal(null);
  if(checkWin()) return;
  if(roundEndPending){
    nextTurn();
    return;
  }
  if(isDouble && p.jailTurns === 0 && !p.bankrupt){
    logMsg(`✨ 더블이 나와 ${p.name}이(가) 한 번 더 굴립니다!`);
    renderTurnPrompt();
  } else {
    nextTurn();
  }
}

function goBankrupt(p){
  const donated = baseAssetValue(p);
  p.bankrupt = true;
  p.money = 0;
  p.owned = [];
  p.baseStages = {};
  p.baseValueMultiplier = 1;
  const donationText = donated > 0 ? `기지 자산 ${donated.toLocaleString()}G는 우주 발전을 위해 사용됩니다.` : '보유한 기지는 없습니다.';
  logMsg(`💥 ${p.name} 원정대의 예산이 바닥나 파산했습니다. ${donationText}`);
  renderTileMarkers();
  renderRail();
}

function getQuizSequence(count){
  const pool = [...QUIZ_BANK];
  const sequence = [];
  while(sequence.length < count && pool.length){
    const pick = Math.floor(Math.random() * pool.length);
    sequence.push(pool.splice(pick, 1)[0]);
  }
  return sequence;
}

function startQuizChallenge(p, config){
  const questions = config.questions ? [...config.questions] : getQuizSequence(config.count || 3);
  const minCorrect = config.minCorrect || questions.length;
  let index = 0;
  let correct = 0;

  function showChallengeResult(){
    const passed = correct >= minCorrect;
    showModal(`
      <h3>${passed ? '허가 퀴즈 통과' : '허가 퀴즈 아쉬움'}</h3>
      <p>${questions.length}문제 중 ${minCorrect}문제 이상 맞혀야 합니다.</p>
      <div class="modal-amount ${passed ? 'pos' : 'neg'}">${correct}/${questions.length}</div>
      ${passed ? `
        <p style="margin-bottom:10px;">${config.confirmText}</p>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-ghost" style="flex:1;" id="quizChallengeDecline">${config.cancelLabel || '이번에는 안 하기'}</button>
          <button class="btn btn-amber" style="flex:1;" id="quizChallengeDone">${config.confirmLabel}</button>
        </div>
      ` : `
        <p style="margin-bottom:10px;">이번에는 허가를 받지 못했습니다. 다음 방문 때 다시 도전하세요.</p>
        <button class="btn btn-amber btn-block" id="quizChallengeFail">확인</button>
      `}
    `, {closable:false});
    logMsg(`🔑 ${p.name}이(가) ${config.logLabel} 퀴즈를 풀었습니다. (${correct}/${questions.length})`);
    if(passed){
      document.getElementById('quizChallengeDone').onclick = ()=>{
        closeModal();
        config.onComplete(correct, questions.length);
      };
      document.getElementById('quizChallengeDecline').onclick = ()=>{
        closeModal();
        config.onDecline();
      };
    } else {
      document.getElementById('quizChallengeFail').onclick = ()=>{
        closeModal();
        config.onFail(correct, questions.length);
      };
    }
  }

  function renderQuestion(){
    const q = questions[index];
    renderJournalQuiz(q);
    showModal(`
      <h3>${config.title}</h3>
      <p>${config.intro}</p>
      <p style="font-weight:700; color:#8a5a14;">${index + 1} / ${questions.length} 문제</p>
      <p>${q.q}</p>
      <div id="quizOpts"></div>
      <div id="quizExplanation" class="answer-box" style="display:none;"></div>
      <div id="quizNextWrap"></div>
    `, {closable:false});

    const optsWrap = document.getElementById('quizOpts');
    q.opts.forEach((opt,i)=>{
      const b = document.createElement('button');
      b.className = 'quiz-opt';
      b.textContent = opt;
      b.onclick = ()=>{
        Array.from(optsWrap.children).forEach(c=>{ c.onclick=null; c.disabled=true; });
        const isCorrect = i === q.a;
        if(isCorrect){
          playSound('correct');
          correct++;
          b.classList.add('correct');
        } else {
          playSound('wrong');
          b.classList.add('wrong');
          optsWrap.children[q.a].classList.add('correct');
        }
        const explanation = document.getElementById('quizExplanation');
        explanation.style.display = 'block';
        explanation.innerHTML = `<b>정답 ${q.opts[q.a]}</b>${q.explanation ? ` · ${q.explanation}` : ''}`;
        const isLast = index === questions.length - 1;
        document.getElementById('quizNextWrap').innerHTML = `<button class="btn btn-amber btn-block" id="quizNext">${isLast ? '결과 확인' : '다음 문제'}</button>`;
        document.getElementById('quizNext').onclick = ()=>{
          index++;
          if(index < questions.length){
            renderQuestion();
          } else {
            showChallengeResult();
          }
        };
      };
      optsWrap.appendChild(b);
    });
  }

  renderQuestion();
}

function buildBaseAfterQuiz(p, planet, isDouble){
  if(p.money < planet.price){
    showModal(`
      <h3>예산 부족</h3>
      <p>${planet.name}에 1단계 탐사 기지를 세우려면 ${planet.price}G가 필요합니다.</p>
      <button class="btn btn-amber btn-block" id="budgetOk">확인</button>
    `, {closable:false});
    document.getElementById('budgetOk').onclick = ()=>{ closeModal(); finishStep(p, isDouble); };
    return;
  }
  p.money -= planet.price;
  p.owned.push(planet.key);
  p.baseStages[planet.key] = 1;
  playSound('build');
  logMsg(`🏗️ ${p.name}이(가) ${planet.name}에 1단계 탐사 기지를 건설했습니다. (-${planet.price}G)`);
  renderTileMarkers();
  renderRail();
  finishStep(p, isDouble);
}

function upgradeBaseAfterQuiz(p, planet, isDouble){
  const cost = upgradeCost(planet);
  if(p.money < cost){
    showModal(`
      <h3>예산 부족</h3>
      <p>${planet.name} 기지를 2단계로 진화하려면 ${cost}G가 필요합니다.</p>
      <button class="btn btn-amber btn-block" id="budgetOk">확인</button>
    `, {closable:false});
    document.getElementById('budgetOk').onclick = ()=>{ closeModal(); finishStep(p, isDouble); };
    return;
  }
  p.money -= cost;
  p.baseStages[planet.key] = 2;
  playSound('build');
  logMsg(`🏛️ ${p.name}이(가) ${planet.name} 기지를 2단계로 진화시켰습니다. (-${cost}G)`);
  renderTileMarkers();
  renderRail();
  finishStep(p, isDouble);
}

function showObservationRecord(p, planet, onDone){
  const selections = {order:null, composition:null, ring:null};
  showModal(`
    <h3>🔭 ${planet.name} 첫 관측 기록</h3>
    <img class="planet-visual" src="${planet.image}" alt="${planet.name} 실제 관측 사진">
    <p>버튼을 눌러 ${planet.name}의 특징을 직접 기록하세요.</p>

    <div class="card-field"><div class="lb">태양에서 몇 번째로 가까울까요?</div></div>
    <div class="choice-grid order-grid" data-group="order">
      ${PLANETS.map(pl=>`<button class="record-choice" data-field="order" data-value="${pl.order}">${pl.order}번째</button>`).join('')}
    </div>

    <div class="card-field"><div class="lb">행성의 종류는?</div></div>
    <div class="choice-grid" data-group="composition">
      <button class="record-choice" data-field="composition" data-value="암석">암석 행성</button>
      <button class="record-choice" data-field="composition" data-value="기체">기체 행성</button>
    </div>

    <div class="card-field"><div class="lb">고리가 있나요?</div></div>
    <div class="choice-grid" data-group="ring">
      <button class="record-choice" data-field="ring" data-value="true">고리 있음</button>
      <button class="record-choice" data-field="ring" data-value="false">고리 없음</button>
    </div>

    <div id="recordAnswer" class="answer-box" style="display:none;"></div>
    <button class="btn btn-amber btn-block" id="checkRecord" disabled>정답 확인</button>
    <button class="btn btn-amber btn-block" id="continueRecord" style="display:none;">기록하고 계속</button>
  `, {closable:false});

  document.querySelectorAll('.record-choice').forEach(button=>{
    button.onclick = ()=>{
      const field = button.dataset.field;
      selections[field] = button.dataset.value;
      document.querySelectorAll(`[data-field="${field}"]`).forEach(btn=>btn.classList.remove('selected'));
      button.classList.add('selected');
      document.getElementById('checkRecord').disabled = !selections.order || !selections.composition || !selections.ring;
    };
  });

  document.getElementById('checkRecord').onclick = ()=>{
    const correct = {
      order: String(planet.order),
      composition: planet.composition,
      ring: String(planet.ring),
    };
    document.querySelectorAll('.record-choice').forEach(button=>{
      const field = button.dataset.field;
      const value = button.dataset.value;
      if(value === correct[field]) button.classList.add('correct');
      if(selections[field] === value && value !== correct[field]) button.classList.add('wrong');
      button.disabled = true;
    });
    document.getElementById('recordAnswer').style.display = 'block';
    document.getElementById('recordAnswer').innerHTML = `
      <b>정답</b><br>
      태양에서 ${planet.order}번째 · ${planet.composition} 행성 · ${planet.ring ? '고리 있음' : '고리 없음'}<br>
      <span style="color:#6b6046;">${planet.desc}</span>
    `;
    document.getElementById('checkRecord').style.display = 'none';
    document.getElementById('continueRecord').style.display = 'block';
  };

  document.getElementById('continueRecord').onclick = ()=>{
    observationRecords[planet.key] = {
      name: planet.name,
      order: planet.order,
      composition: planet.composition,
      ring: planet.ring,
      colorText: planet.colorText,
      surface: planet.surface,
      desc: planet.desc,
      observer: p.name,
    };
    logMsg(`🔭 ${p.name}이(가) ${planet.name} 관측 기록을 완성했습니다.`);
    closeModal();
    onDone();
  };
}

/* ---- Planet tile ---- */
function showPlanetTile(p, d, isDouble){
  const planet = d.planet;
  const ownerIdx = getOwnerIndex(planet.key);

  if(ownerIdx === -1){
    // unowned - offer first-stage base
    showModal(`
      <h3>${planet.name} 도착</h3>
      <p>${planet.desc}</p>
      <div class="modal-amount" style="color:var(--amber-deep,#C97F1E)">${planet.price}G</div>
      <p style="margin-bottom:10px;">퀴즈 3문제 중 2문제 이상 맞히면 건설할 수 있습니다. 1단계 탐사 기지를 건설하시겠습니까?</p>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-ghost" style="flex:1;" id="skipBuy">건너뛰기</button>
        <button class="btn btn-amber" style="flex:1;" id="doBuy" ${p.money < planet.price ? 'disabled' : ''}>1단계 건설</button>
      </div>
    `, {closable:false});
    document.getElementById('skipBuy').onclick = ()=>{ closeModal(); finishStep(p, isDouble); };
    document.getElementById('doBuy').onclick = ()=>{
      startQuizChallenge(p, {
        title: '건설 허가 퀴즈',
        intro: `${planet.name} 기지 건설 허가를 받으려면 3문제 중 2문제 이상 맞혀야 합니다.`,
        logLabel: `${planet.name} 건설 허가`,
        questions: BASE_QUIZ_BANK[planet.key].slice(0, 3),
        minCorrect: 2,
        confirmText: `${planet.name}에 1단계 탐사 기지를 건설하시겠습니까?`,
        confirmLabel: '건설하기',
        cancelLabel: '건설 안 함',
        onComplete: ()=> buildBaseAfterQuiz(p, planet, isDouble),
        onDecline: ()=> finishStep(p, isDouble),
        onFail: ()=> finishStep(p, isDouble),
      });
    };
  } else if(ownerIdx === players.indexOf(p)){
    const stage = getBaseStage(p, planet.key);
    const cost = upgradeCost(planet);
    if(stage < 2){
      showModal(`
        <h3>${planet.name} 재방문</h3>
        <p>${planet.desc}</p>
        <p>현재 <b>1단계 탐사 기지</b>입니다. 퀴즈 3문제 중 2문제 이상 맞히면 2단계 관측 기지로 진화할 수 있고 통행료가 ${tollFor(planet, 2)}G로 올라갑니다.</p>
        <div class="modal-amount" style="color:var(--amber-deep,#C97F1E)">${cost}G</div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-ghost" style="flex:1;" id="skipUpgrade">그대로 두기</button>
          <button class="btn btn-amber" style="flex:1;" id="doUpgrade" ${p.money < cost ? 'disabled' : ''}>2단계 진화</button>
        </div>
      `, {closable:false});
      document.getElementById('skipUpgrade').onclick = ()=>{ closeModal(); finishStep(p, isDouble); };
      document.getElementById('doUpgrade').onclick = ()=>{
        startQuizChallenge(p, {
          title: '진화 허가 퀴즈',
          intro: `${planet.name} 기지 진화 허가를 받으려면 3문제 중 2문제 이상 맞혀야 합니다.`,
          logLabel: `${planet.name} 진화 허가`,
          questions: BASE_QUIZ_BANK[planet.key].slice(3, 6),
          minCorrect: 2,
          confirmText: `${planet.name} 기지를 2단계로 진화하시겠습니까?`,
          confirmLabel: '진화하기',
          cancelLabel: '진화 안 함',
          onComplete: ()=> upgradeBaseAfterQuiz(p, planet, isDouble),
          onDecline: ()=> finishStep(p, isDouble),
          onFail: ()=> finishStep(p, isDouble),
        });
      };
      return;
    }
    showModal(`
      <h3>${planet.name}</h3>
      <p>${planet.desc}</p>
      <p style="color:var(--amber-deep,#C97F1E); font-weight:700;">이미 2단계까지 진화한 탐사 기지입니다.</p>
      <button class="btn btn-amber btn-block" id="okClose">확인</button>
    `, {closable:false});
    document.getElementById('okClose').onclick = ()=>{ closeModal(); finishStep(p, isDouble); };
  } else {
    const owner = players[ownerIdx];
    const stage = getBaseStage(owner, planet.key);
    const toll = tollFor(planet, stage);
    const payableToll = Math.min(toll, p.money);
    const takeover = buyoutCost(planet, stage);
    showModal(`
      <h3>${planet.name}</h3>
      <p>${planet.desc}</p>
      <p>이곳은 <b>${owner.name}</b>의 <b>${stage}단계</b> 탐사 기지입니다.</p>
      <div class="modal-amount neg">-${toll}G</div>
      <p style="margin-bottom:10px;">${p.tollPasses > 0 ? '면제권을 사용하거나 기지를 인수할 수 있습니다.' : p.money < toll ? `보유금이 ${p.money}G라 통행료가 부족합니다. 남은 돈을 모두 지급하면 파산합니다.` : '통행료를 내거나, 충분한 예산이 있으면 기지를 인수할 수 있습니다.'}</p>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-ghost" style="flex:1;" id="payToll">${p.tollPasses > 0 ? '면제권 사용' : p.money < toll ? `${payableToll}G 지급·파산` : `${toll}G 통행료`}</button>
        <button class="btn btn-amber" style="flex:1;" id="takeOver" ${p.money < takeover ? 'disabled' : ''}>${takeover}G 인수</button>
      </div>
    `, {closable:false});
    document.getElementById('payToll').onclick = ()=>{
      let bankruptFromToll = false;
      if(p.tollPasses > 0){
        p.tollPasses--;
        logMsg(`🪙 ${p.name}이(가) 통행료 면제권으로 ${planet.name} 통행료를 면제받았습니다.`);
      } else {
        p.money -= payableToll;
        owner.money += payableToll;
        if(payableToll < toll){
          bankruptFromToll = true;
          logMsg(`💸 ${p.name}이(가) 남은 ${payableToll}G를 모두 지불했지만 통행료 ${toll}G가 부족합니다.`);
        } else {
          logMsg(`💸 ${p.name}이(가) ${owner.name}에게 ${stage}단계 통행료 ${toll}G를 지불했습니다.`);
        }
      }
      renderRail();
      closeModal();
      if(bankruptFromToll) goBankrupt(p);
      finishStep(p, isDouble);
    };
    document.getElementById('takeOver').onclick = ()=>{
      startQuizChallenge(p, {
        title:'인수 허가 O/X',
        intro:`${planet.name} 기지를 인수하려면 O/X 3문제 중 2문제 이상 맞혀야 합니다.`,
        logLabel:`${planet.name} 인수 허가`,
        questions:shuffleQuestions(BASE_QUIZ_BANK[planet.key]).slice(0, 3),
        minCorrect:2,
        confirmText:`${takeover}G를 내고 ${planet.name} ${stage}단계 기지를 인수하시겠습니까?`,
        confirmLabel:'인수하기',
        cancelLabel:'인수 안 함',
        onComplete:()=>{
          p.money -= takeover;
          owner.money += takeover;
          owner.owned = owner.owned.filter(key=>key !== planet.key);
          delete owner.baseStages[planet.key];
          p.owned.push(planet.key);
          p.baseStages[planet.key] = stage;
          logMsg(`🔁 ${p.name}이(가) ${owner.name}에게 ${takeover}G를 내고 ${planet.name} ${stage}단계 기지를 인수했습니다.`);
          renderTileMarkers();
          renderRail();
          finishStep(p, isDouble);
        },
        onDecline:()=>finishStep(p, isDouble),
        onFail:()=>finishStep(p, isDouble),
      });
    };
  }
}

      document.querySelectorAll(`.body-choice[data-field="${field}"]`).forEach(item=>item.classList.remove('selected'));

    <button class="btn btn-ghost btn-block" id="missionMiss" disabled>아쉬워요 -30G</button>
  `, {closable:false});
  let missionTimerId = null;
  const timerButton = document.getElementById('startMissionTimer');
  if(timerButton) timerButton.onclick = ()=>{
    timerButton.disabled = true;
    let remaining = mission.seconds;
    const display = document.getElementById('missionTimerDisplay');
    display.textContent = `${remaining}초`;
    missionTimerId = setInterval(()=>{
      remaining--;
      if(remaining > 0){
        display.textContent = `${remaining}초`;
        return;
      }
      clearInterval(missionTimerId);
      missionTimerId = null;
      display.textContent = '시간 종료!';
      timerButton.textContent = '5초 도전 완료';
      document.getElementById('showMissionAnswer').disabled = false;
      playTone(880,.18,'sine',.08);
      playTone(660,.28,'sine',.08,.16);
    }, 1000);
  };
  function completeMission(success, usedTranslator=false){
    if(missionTimerId) clearInterval(missionTimerId);
    playSound(success ? 'correct' : 'wrong');
    if(success){
      p.money += 100;
      logMsg(`🎤 ${p.name}이(가) ${usedTranslator ? '만능 우주 번역기로 ' : ''}미션 성공! ${mission.title} (+100G)`);
    } else {
      p.money = Math.max(0, p.money - 30);
      logMsg(`🎤 ${p.name}이(가) 미션을 다시 연습합니다. ${mission.title} (-30G)`);
    }
    renderRail();
    closeModal();
    if(p.money <= 0) goBankrupt(p);
    finishStep(p, isDouble);
  }
  const translator = document.getElementById('useMissionTranslator');
  if(translator) translator.onclick = ()=>{
    p.successPasses--;
    completeMission(true, true);
  };
  document.getElementById('showMissionAnswer').onclick = ()=>{
    document.getElementById('missionAnswer').style.display = 'block';
    document.getElementById('missionSuccess').disabled = false;
    document.getElementById('missionMiss').disabled = false;
    document.getElementById('showMissionAnswer').disabled = true;
  };
  document.getElementById('missionSuccess').onclick = ()=>completeMission(true);
  document.getElementById('missionMiss').onclick = ()=>completeMission(false);
}

        p.money = Math.max(0, p.money - 50);

      }

    const nextLabel = p.money <= 0 ? '결과 확인' : correct ? '황금열쇠 뽑기' : '다음 차례로';
    document.getElementById('spaceQuizNext').innerHTML = `<button class="btn btn-amber btn-block" id="spaceQuizContinue">${nextLabel}</button>`;

function finishGoldenTurn(p, isDouble){
  closeModal();

  finishStep(p, isDouble);
}

function resolveGoldenKey(p, card, isDouble){
  if(card.amount){
    p.money = Math.max(0, p.money + card.amount);
    logMsg(`${card.amount > 0 ? '💰' : '💸'} ${p.name}의 연구비가 ${Math.abs(card.amount)}G ${card.amount > 0 ? '늘었습니다' : '줄었습니다'}.`);
    renderRail();
    goldenResult(`
      <div class="modal-amount ${card.amount > 0 ? 'pos' : 'neg'}">${card.amount > 0 ? '+' : ''}${card.amount}G</div>
      <button class="btn btn-amber btn-block" id="goldenKeyOk">확인</button>
    `);
    document.getElementById('goldenKeyOk').onclick = ()=>finishGoldenTurn(p, isDouble);
    return;
  }

  if(card.collectAll){
    let received = 0;
    players.filter(other=>other !== p && !other.bankrupt).forEach(other=>{
      const paid = Math.min(card.collectAll, other.money);
      other.money -= paid;
      p.money += paid;
      received += paid;
      logMsg(`🧹 ${other.name}이(가) ${p.name}에게 ${paid}G를 전달했습니다.`);
    });
    renderRail();
    goldenResult(`<div class="modal-amount pos">+${received}G</div><button class="btn btn-amber btn-block" id="goldenKeyOk">확인</button>`);
    document.getElementById('goldenKeyOk').onclick = ()=>finishGoldenTurn(p, isDouble);
    return;
  }

  if(card.tollPasses || card.successPasses || card.blackHolePasses){
    if(card.tollPasses) p.tollPasses += card.tollPasses;
    if(card.successPasses) p.successPasses += card.successPasses;
    if(card.blackHolePasses) p.blackHolePasses += card.blackHolePasses;
    renderRail();
    goldenResult(`<div class="answer-box"><b>아이템을 보관했습니다.</b><br>${card.desc}</div><button class="btn btn-amber btn-block" id="goldenKeyOk">확인</button>`);
    document.getElementById('goldenKeyOk').onclick = ()=>finishGoldenTurn(p, isDouble);
    return;
  }

  if(card.moveToEmptyPlanet){
    const emptyPlanets = PLANETS.filter(planet=>getOwnerIndex(planet.key) === -1);
    if(!emptyPlanets.length){
      goldenResult(`<div class="answer-box">현재 주인 없는 행성이 없습니다. 이동하지 않습니다.</div><button class="btn btn-amber btn-block" id="goldenKeyOk">확인</button>`);
      document.getElementById('goldenKeyOk').onclick = ()=>finishGoldenTurn(p, isDouble);
      return;
    }
    goldenResult(`
      <div class="answer-box"><b>이동할 빈 행성을 선택하세요.</b><br>출발지를 지나도 보너스는 받지 않습니다.</div>
      <div id="goldenPlanetChoices"></div>
    `);
    const wrap = document.getElementById('goldenPlanetChoices');
    emptyPlanets.forEach(planet=>{
      const button = document.createElement('button');
      button.className = 'quiz-opt';
      button.innerHTML = `<img class="choice-planet-photo" src="${planet.image}" alt="">${planet.name}`;
      button.onclick = ()=>{
        p.position = BOARD.findIndex(tile=>tile.type === 'planet' && tile.planet.key === planet.key);
        logMsg(`🌀 ${p.name}이(가) 웜홀을 타고 ${planet.name}(으)로 이동했습니다.`);
        renderTokens();
        renderRail();
        closeModal();
        setTimeout(()=>resolveTile(p, isDouble), ARRIVAL_PAUSE_MS);
      };
      wrap.appendChild(button);
    });
    return;
  }

  if(card.moveBack){
    goldenResult(`<div class="answer-box">뒤로 ${card.moveBack}칸 이동합니다.</div><button class="btn btn-amber btn-block" id="goldenMoveBack">이동하기</button>`);
    document.getElementById('goldenMoveBack').onclick = ()=>{
      closeModal();
      movePlayerBackward(p, card.moveBack, isDouble);
    };
    return;
  }

  if(card.summonPoorest){
    const candidates = players.filter(other=>other !== p && !other.bankrupt);
    const poorest = candidates.sort((a,b)=>a.money-b.money)[0];
    if(poorest){
      poorest.position = p.position;
      logMsg(`🆘 ${p.name}이(가) ${poorest.name}을(를) 같은 칸으로 불렀습니다.`);
      renderTokens();
      renderRail();
      goldenResult(`<div class="answer-box">현재 연구비가 가장 적은 <b>${poorest.name}</b>이(가) 내 칸으로 이동했습니다.</div><button class="btn btn-amber btn-block" id="goldenKeyOk">확인</button>`);
    } else {
      goldenResult(`<div class="answer-box">불러올 다른 플레이어가 없습니다.</div><button class="btn btn-amber btn-block" id="goldenKeyOk">확인</button>`);
    }
    document.getElementById('goldenKeyOk').onclick = ()=>finishGoldenTurn(p, isDouble);
    return;
  }

  if(card.action === 'dance'){
    goldenResult(`
      <div class="answer-box"><b>무중력 춤을 5초 동안 춰 보세요!</b></div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-ghost" style="flex:1;" id="danceSkip">하지 않기 -30G</button>
        <button class="btn btn-amber" style="flex:1;" id="danceDone">춤 성공 +100G</button>
      </div>
    `);
    document.getElementById('danceDone').onclick = ()=>completeGoldenAction(p, 100, '무중력 우주 댄스 성공', isDouble);
    document.getElementById('danceSkip').onclick = ()=>completeGoldenAction(p, -30, '무중력 우주 댄스를 하지 않았습니다', isDouble);
    return;
  }

  if(card.action === 'greeting'){
    goldenResult(`<div class="answer-box">양쪽 집게손가락을 머리 위에 올리고<br><b>“삐리삐리 뽀로뽀로!”</b>라고 인사하세요.</div><button class="btn btn-amber btn-block" id="greetingDone">인사 완료 +50G</button>`);
    document.getElementById('greetingDone').onclick = ()=>completeGoldenAction(p, 50, '외계인 교신 성공', isDouble);
    return;
  }

  if(card.action === 'asteroid'){
    const targets = players.filter(other=>other !== p && !other.bankrupt);
    if(!targets.length){
      goldenResult(`<div class="answer-box">함께 방어 자세를 취할 다른 플레이어가 없습니다.</div><button class="btn btn-amber btn-block" id="goldenKeyOk">확인</button>`);
      document.getElementById('goldenKeyOk').onclick = ()=>finishGoldenTurn(p, isDouble);
      return;
    }
    goldenResult(`<div class="answer-box"><b>“으악, 꽉 잡아!”</b>라고 외치고 3초 동안 방어 자세를 취하세요.<br>가장 늦은 사람을 선택하세요.</div><div id="asteroidTargets"></div>`);
    const wrap = document.getElementById('asteroidTargets');
    targets.forEach(target=>{
      const button = document.createElement('button');
      button.className = 'quiz-opt';
      button.textContent = `${target.name}에게서 30G 받기`;
      button.onclick = ()=>{
        const paid = Math.min(30, target.money);
        target.money -= paid;
        p.money += paid;
        logMsg(`☄️ ${p.name}이(가) ${target.name}에게서 ${paid}G를 받았습니다.`);
        renderRail();
        finishGoldenTurn(p, isDouble);
      };
      wrap.appendChild(button);
    });
    return;
  }
}

function completeGoldenAction(p, amount, message, isDouble){
  p.money = Math.max(0, p.money + amount);
  logMsg(`🎭 ${p.name}: ${message} (${amount > 0 ? '+' : ''}${amount}G)`);
  renderRail();
  finishGoldenTurn(p, isDouble);
}

function showObservationArchive(){

    .map(planet => observationRecords[planet.key])
    .filter(Boolean);

    .map(body => bodyObservationRecords[body.key])

      태양에서 ${record.order}번째 · ${record.composition} 행성 · ${record.ring ? '고리 있음' : '고리 없음'}<br>
      색깔: ${record.colorText}<br>
      ${record.desc}
    </div>
  `).join('');
  const bodyContent = bodyRecords.map(record=>`
    <div class="journal-record">
      <b>${record.name}</b> · ${record.observer} 기록<br>
      ${record.category}<br>
      특징: ${record.feature}<br>
      ${record.desc}
    </div>
  `).join('');
  const content = planetContent || bodyContent ? `${planetContent}${bodyContent}` : '<p>아직 완성한 관측 기록이 없습니다.</p>';
  showModal(`
    <h3>관측기록장</h3>
    ${content}
    <button class="btn btn-amber btn-block" id="closeJournalArchive">닫기</button>
  `, {closable:false});
  document.getElementById('closeJournalArchive').onclick = closeModal;
}
function lighten(hex){
  // rough lighten for radial highlight
  const num = parseInt(hex.replace('#',''),16);
  let r = (num>>16)+60, g=((num>>8)&0xff)+60, b=(num&0xff)+60;
  r=Math.min(255,r); g=Math.min(255,g); b=Math.min(255,b);
  return `rgb(${r},${g},${b})`;
}
